name: oneday-human-pilot

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: node apps/api/dist/main.js
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://oneday:oneday_local_only@postgres:5432/oneday_human_pilot
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must be set}
      CORS_ORIGINS: http://127.0.0.1:3201,http://127.0.0.1:3202,http://127.0.0.1:3203,http://127.0.0.1:3204
      PUBLIC_BASE_URL: http://127.0.0.1:3200
    ports: ['3200:3001']
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: node apps/worker/dist/index.js
    environment:
      NODE_ENV: production
      HEALTH_PORT: 3002
      DATABASE_URL: postgresql://oneday:oneday_local_only@postgres:5432/oneday_human_pilot
    ports: ['3205:3002']
  consumer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: pnpm --filter @oneday/consumer-web exec next start --hostname 0.0.0.0 --port 3201
    environment:
      {
        NODE_ENV: production,
        API_BASE_URL: http://api:3001,
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3200,
      }
    ports: ['3201:3201']
  employee:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: pnpm --filter @oneday/employee-web exec next start --hostname 0.0.0.0 --port 3202
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3200 }
    ports: ['3202:3202']
  management:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: pnpm --filter @oneday/management-web exec next start --hostname 0.0.0.0 --port 3203
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3200 }
    ports: ['3203:3203']
  platform:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: human-pilot
    command: pnpm --filter @oneday/platform-web exec next start --hostname 0.0.0.0 --port 3204
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3200 }
    ports: ['3204:3204']

networks:
  default:
    external: true
    name: oneday-v3_default
